<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory Organization Designer</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --ink: #1d2733;
        --dim: #5d6a79;
        --line: #dde3ea;
        --accent: #1f5fa8;
        --ok: #1f8a4c;
        --ok-bg: #eef8f1;
        --off: #b4761a;
        --off-bg: #fdf6e8;
        --low: #d0574e;
        --mid: #d6a033;
        --high: #3f8f5e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      header {
        background: var(--card);
        border-bottom: 1px solid var(--line);
        padding: 18px 24px 0;
      }
      h1 {
        margin: 0;
        font-size: 19px;
        letter-spacing: 0.2px;
      }
      .sub {
        margin: 4px 0 14px;
        color: var(--dim);
        font-size: 13px;
      }
      #tabs {
        display: flex;
        gap: 2px;
        flex-wrap: wrap;
      }
      .tab {
        border: 1px solid var(--line);
        border-bottom: none;
        background: #eef1f5;
        color: var(--dim);
        padding: 8px 14px;
        border-radius: 6px 6px 0 0;
        cursor: pointer;
        font-size: 13px;
      }
      .tab-on {
        background: var(--card);
        color: var(--ink);
        font-weight: 600;
      }
      main {
        padding: 20px 24px 60px;
        max-width: 1180px;
      }

      .banner {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 18px;
      }
      .banner-ok {
        background: var(--ok-bg);
        border-color: #bfe3cc;
      }
      .banner-off {
        background: var(--off-bg);
        border-color: #ecd9ad;
      }
      .banner-head {
        font-weight: 600;
        margin-bottom: 10px;
      }
      .banner-ok .banner-head {
        color: var(--ok);
      }
      .banner-off .banner-head {
        color: var(--off);
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 10px;
      }
      .chip-ok {
        border-color: #bfe3cc;
      }
      .chip-off {
        border-color: #e3b7b3;
      }
      .chip-sub {
        color: var(--dim);
        font-size: 12px;
      }

      .picker {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .pick {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--dim);
        padding: 7px 13px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 13px;
      }
      .pick-on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .blurb {
        color: var(--dim);
        margin: 0 0 16px;
        max-width: 760px;
      }

      .stats {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 14px;
        min-width: 130px;
      }
      .stat-k {
        color: var(--dim);
        font-size: 12px;
      }
      .stat-v {
        font-size: 20px;
        font-weight: 600;
        margin-top: 2px;
      }

      .centres {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
        gap: 12px;
      }
      .centre {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .centre-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid var(--line);
        padding-bottom: 6px;
        margin-bottom: 6px;
      }
      .centre-id {
        font-weight: 600;
      }
      .centre-n {
        color: var(--dim);
        font-size: 12px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }
      .mini td {
        padding: 3px 2px;
        vertical-align: middle;
      }
      .big {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .big th,
      .big td {
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
      }
      .big th {
        background: #eef1f5;
        font-size: 12px;
        color: var(--dim);
        font-weight: 600;
      }
      .big tr:last-child td {
        border-bottom: none;
      }
      .row-on {
        background: #f2f7fd;
      }
      .l {
        text-align: left;
      }
      .r {
        text-align: right;
      }
      .strong {
        font-weight: 600;
      }
      .wide {
        width: 34%;
      }

      .bar {
        position: relative;
        display: block;
        height: 15px;
        background: #eef1f5;
        border-radius: 3px;
        overflow: hidden;
        min-width: 70px;
      }
      .bar-wide {
        height: 11px;
      }
      .bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 3px;
      }
      .bar-low {
        background: var(--low);
      }
      .bar-mid {
        background: var(--mid);
      }
      .bar-high {
        background: var(--high);
      }
      .bar-count {
        background: var(--accent);
        opacity: 0.75;
      }
      .bar-text {
        position: relative;
        display: block;
        text-align: right;
        padding-right: 4px;
        font-size: 11px;
        color: #27313c;
        line-height: 15px;
      }

      .oplab {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .glyph {
        vertical-align: middle;
        flex: none;
      }
      .route {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        flex-wrap: wrap;
      }
      .step {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: #f2f5f8;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 2px 6px;
      }
      .step-t {
        font-size: 11px;
        color: var(--dim);
      }
      .arrow {
        color: #9aa7b4;
      }
      .dem {
        width: 86px;
        text-align: right;
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        font: inherit;
      }

      .insight {
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        border-radius: 8px;
        padding: 12px 16px;
        margin: 18px 0;
        max-width: 830px;
      }
      .insight-soft {
        border-left-color: #9aa7b4;
      }
      .insight-ask {
        border-left-color: var(--off);
      }
      .insight h3 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      .insight p,
      .insight li {
        color: var(--dim);
        margin: 6px 0;
      }
      .insight ul {
        margin: 6px 0;
        padding-left: 18px;
      }
      .note {
        color: var(--dim);
        font-size: 12.5px;
        max-width: 830px;
        margin: 12px 0 0;
      }
      .h3 {
        font-size: 14px;
        margin: 22px 0 8px;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      .leg {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--dim);
        font-size: 12.5px;
      }

      .controls {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 14px;
      }
      .ctl {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .ctl-k {
        color: var(--dim);
        font-size: 12px;
        margin-right: 2px;
      }
      .mini-pick {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--dim);
        padding: 3px 9px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
      }
      .mini-on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .queue {
        color: var(--dim);
        font-size: 11.5px;
        width: 34px;
      }
      .dim {
        color: var(--dim);
      }
      .row-best {
        background: #eef8f1;
      }
      .diagram {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 18px;
      }
      .plan {
        display: block;
        max-width: 820px;
        margin: 0 auto;
      }
      .net {
        display: block;
        max-width: 780px;
        margin: 0 auto;
      }
      .step-in {
        width: 44px;
        border: none;
        background: transparent;
        color: var(--dim);
        font: inherit;
        font-size: 11px;
        text-align: right;
        padding: 0;
      }
      .step-in:focus {
        background: #fff;
        outline: 1px solid var(--accent);
        border-radius: 3px;
      }
      .inline-ctl {
        margin-left: 10px;
      }
      .forms {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      .form {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        min-width: 270px;
      }
      .form-k {
        color: var(--dim);
        font-size: 12px;
        margin-bottom: 6px;
      }
      .form-row {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 4px 0;
      }
      .form-id {
        font-weight: 600;
        width: 34px;
      }
      .text {
        flex: 1;
        padding: 3px 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        font: inherit;
        font-size: 12.5px;
      }
      .form-ok {
        color: var(--ok);
        font-size: 11.5px;
        margin-top: 6px;
      }
      .form-warn {
        color: var(--low);
        font-size: 11.5px;
        margin-top: 6px;
      }
      .hidden-file {
        display: none;
      }
      .narrow {
        width: 62px;
      }

      @media (max-width: 640px) {
        header,
        main {
          padding-left: 16px;
          padding-right: 16px;
        }
      }

  <body>
    <header>
      <h1>Factory Organization Designer</h1>
      <p class="sub">
        The seven-product case from the organization design lecture, with the
        numbers attached — ISyE 6202 / 6335, version 1
      </p>
      <nav id="tabs"></nav>
    </header>
    <main id="body"></main>
    <script>
/* Factory Organization Designer — the case
 *
 * The seven-product case Prof. Montreuil teaches from, read off slide 3 of
 * "Supply Chain Facility Organization Design Fundamentals" (version 2025/10/14),
 * itself from Montreuil B. & P. Lefrancois (1996), Organizing Factories as
 * Responsibility Networks.
 *
 * The slides carry the routings and the equipment counts but no demand and no
 * operation times, so those two are synthetic. They were chosen by reverse
 * calibration: demand and times were fitted until the function organization
 * computes exactly the processor counts drawn on slide 19.
 */

var CASE = {
  period: {
    // Slide 64 of the same deck sets a period to a 20-hour workday at 80%
    // processor efficiency. Reused here so the numbers stay in his convention.
    hours: 20,
    efficiency: 0.8,
    label: "one 20-hour workday",
  },

  // A processor's footprint in metres, the floor it needs to itself including
  // the operator's place and the room to load and unload it. The slides draw
  // the machines at different sizes but give no dimensions, so these are
  // synthetic like the demand and the times, and unlike those two they have no
  // count on a slide to be calibrated against. They are the one input here
  // that is a plain assumption.
  operations: [
    {
      id: "O1",
      name: "blue circle",
      shape: "circle",
      fill: "#5b9bd5",
      w: 3,
      h: 3,
    },
    {
      id: "O2",
      name: "cyan ellipse",
      shape: "ellipse",
      fill: "#4fc3e8",
      w: 4,
      h: 2.5,
    },
    {
      id: "O3",
      name: "red rectangle",
      shape: "rect",
      fill: "#e05a5a",
      w: 5,
      h: 3,
    },
    {
      id: "O4",
      name: "yellow parallelogram",
      shape: "para",
      fill: "#f2ce1b",
      w: 3,
      h: 2,
    },
    {
      id: "O5",
      name: "orange rectangle",
      shape: "rect",
      fill: "#f2994a",
      w: 4,
      h: 3,
    },
    {
      id: "O6",
      name: "green gear",
      shape: "gear",
      fill: "#9ccc65",
      w: 2.5,
      h: 2.5,
    },
    {
      id: "O7",
      name: "purple hexagon",
      shape: "hex",
      fill: "#a98bd8",
      w: 6,
      h: 4,
    },
    {
      id: "O8",
      name: "orange trapezoid",
      shape: "trap",
      fill: "#e8a33d",
      w: 3.5,
      h: 3,
    },
  ],

  // Demand is held per period. Year 1 carries the calibrated demand, so the
  // reconciliation against slide 19 is always read on Year 1.
  periods: ["Year 1", "Year 2", "Year 3", "Year 4"],

  // demand per period, and the coefficient of variation of that demand.
  // Year 1 is the calibrated column; later years grow and shrink unevenly, and
  // P5 is withdrawn after Year 3, so an organization good in Year 1 is not
  // automatically good in Year 4.
  products: [
    {
      id: "P1",
      demand: [450, 520, 600, 690],
      cv: 0.15,
      route: ["O1", "O2", "O3", "O4", "O5", "O6"],
    },
    {
      id: "P2",
      demand: [500, 420, 300, 180],
      cv: 0.2,
      route: ["O1", "O2", "O3", "O7", "O8"],
    },
    {
      id: "P3",
      demand: [400, 430, 450, 470],
      cv: 0.18,
      route: ["O2", "O8", "O1", "O4", "O5", "O6"],
    },
    {
      id: "P4",
      demand: [350, 470, 640, 860],
      cv: 0.25,
      route: ["O2", "O8", "O1", "O5", "O4", "O6"],
    },
    {
      id: "P5",
      demand: [300, 240, 170, 0],
      cv: 0.12,
      route: ["O5", "O3", "O2", "O1", "O4", "O6"],
    },
    {
      id: "P6",
      demand: [550, 620, 700, 790],
      cv: 0.2,
      route: ["O1", "O8", "O4", "O2", "O5"],
    },
    {
      id: "P7",
      demand: [450, 460, 470, 480],
      cv: 0.15,
      route: ["O1", "O4", "O8", "O2", "O5"],
    },
  ],

  // minutes per unit, by operation and product
  times: {
    O1: { P1: 1.63, P2: 1.57, P3: 1.32, P4: 1.2, P5: 1.39, P6: 1.31, P7: 1.59 },
    O2: {
      P1: 1.53,
      P2: 1.68,
      P3: 1.78,
      P4: 2.08,
      P5: 1.71,
      P6: 1.51,
      P7: 1.94,
    },
    O3: { P1: 1.44, P2: 1.17, P5: 1.65 },
    O4: { P1: 1.13, P3: 1.05, P4: 1.09, P5: 0.8, P6: 1.01, P7: 1.09 },
    O5: { P1: 1.1, P3: 0.99, P4: 0.79, P5: 0.97, P6: 1.06, P7: 1.22 },
    O6: { P1: 1.98, P3: 1.56, P4: 1.89, P5: 1.38 },
    O7: { P2: 1.73 },
    O8: { P2: 1.58, P3: 1.14, P4: 1.72, P6: 1.45, P7: 1.8 },
  },

  // What slide 19 draws, per function center. The calibration target.
  drawn: { O1: 5, O2: 6, O3: 2, O4: 3, O5: 3, O6: 3, O7: 1, O8: 4 },

  // Default groupings, editable in the page.
  groups: [
    { id: "G-A", products: ["P1", "P2", "P5"] },
    { id: "G-B", products: ["P3", "P4"] },
    { id: "G-C", products: ["P6", "P7"] },
  ],
  processCenters: [
    { id: "p1", ops: ["O1", "O2"] },
    { id: "p2", ops: ["O3", "O4", "O5"] },
    { id: "p3", ops: ["O6", "O7", "O8"] },
  ],
  fractalCount: 3,

  // The lecture case carries no prices. These are placeholders so the cost of
  // changing a factory year on year has a shape; they are meant to be replaced
  // with real figures. What matters is the ratio: moving a machine is cheaper
  // than buying one, and that is what makes an inflexible organization expensive.
  money: {
    install: 250000, // a new processor, delivered and installed
    relocate: 25000, // moving an existing processor to another centre
    floor: 2700, // one square metre of factory floor, built
    currency: "$",
  },

  // Room left around the machines: inside a centre for the operator and the
  // parts waiting at the machine, and between centres for the aisles that
  // carry work from one to the next.
  space: {
    insideCentre: 0.45, // of the machine footprint, added as working room
    betweenCentres: 0.3, // of the centre area, added as aisle
    aisle: 3, // metres of gangway drawn between rows of centres
  },

  // Service levels offered for capacity robustness, as he asked: size capacity
  // so demand is met with a stated probability rather than on the average.
  serviceLevels: [
    { label: "mean", p: 0.5, z: 0 },
    { label: "90%", p: 0.9, z: 1.2816 },
    { label: "95%", p: 0.95, z: 1.6449 },
    { label: "99%", p: 0.99, z: 2.3263 },
  ],
};

</script>
    <script>
/* Factory Organization Designer — the capacity engine
 *
 * One rule runs the whole tool:
 *
 *     processors in a centre = ceil( work the centre is given / work one processor can do )
 *     utilization            = work given / (processors * work one processor can do)
 *
 * Everything that distinguishes one organization from another is which work
 * lands in which centre before that ceiling is taken. Splitting the factory
 * finer means more ceilings, and every ceiling wastes a fraction of a machine.
 *
 * Around that rule sit four things the lecture asks for and the slides cannot
 * show: capacity sized for a stated robustness rather than for the average,
 * the queue that builds in front of a busy centre, the flow between centres,
 * and what it costs to change the factory from one year to the next.
 */

var Engine = (function () {
  /* ---------------- the case, read ---------------- */

  function availableMinutes(c) {
    return c.period.hours * 60 * c.period.efficiency;
  }
  function product(c, id) {
    return c.products.filter(function (p) {
      return p.id === id;
    })[0];
  }
  function allProducts(c) {
    return c.products.map(function (p) {
      return p.id;
    });
  }
  function allOps(c) {
    return c.operations.map(function (o) {
      return o.id;
    });
  }
  function routeOf(c, id) {
    var p = product(c, id);
    return p ? p.route : [];
  }
  function demandOf(c, id, period) {
    var p = product(c, id);
    if (!p) return 0;
    var d = p.demand[Math.min(period, p.demand.length - 1)];
    return typeof d === "number" ? d : 0;
  }
  function cvOf(c, id) {
    var p = product(c, id);
    return p && typeof p.cv === "number" ? p.cv : 0;
  }
  function timeOf(c, op, id) {
    var row = c.times[op];
    return row && typeof row[id] === "number" ? row[id] : 0;
  }
  function visits(c, op, id) {
    return routeOf(c, id).filter(function (o) {
      return o === op;
    }).length;
  }

  function ceilAt(x) {
    return Math.ceil(Number(x.toFixed(9)));
  }

  /* ---------------- work, with its spread ----------------
   *
   * A product's demand is one random quantity, so every minute that product
   * puts into a centre moves together. The spread is therefore taken per
   * product and only then combined across products, which are independent.
   */

  function workStats(c, ops, productIds, period, share) {
    var f = typeof share === "number" ? share : 1;
    var mean = 0,
      variance = 0,
      units = 0,
      itemMinutes = 0;
    productIds.forEach(function (pid) {
      var perUnit = 0,
        v = 0;
      ops.forEach(function (op) {
        var n = visits(c, op, pid);
        if (!n) return;
        perUnit += n * timeOf(c, op, pid);
        v += n;
      });
      if (!perUnit) return;
      var d = demandOf(c, pid, period) * f;
      mean += d * perUnit;
      variance += Math.pow(cvOf(c, pid) * d * perUnit, 2);
      units += d * v; // item visits arriving at this station
      itemMinutes += d * perUnit;
    });
    return {
      mean: mean,
      sd: Math.sqrt(variance),
      arrivals: units,
      serviceMinutes: units ? itemMinutes / units : 0,
    };
  }

  /* ---------------- queueing at a station ----------------
   *
   * Erlang C on the offered load, so a centre that is nearly full is shown
   * with the waiting it actually causes rather than only with its utilization.
   */

  function erlangC(servers, offered) {
    if (servers <= 0) return 1;
    if (offered >= servers) return 1;
    var b = 1;
    for (var k = 1; k <= servers; k++) b = (offered * b) / (k + offered * b);
    var rho = offered / servers;
    return b / (1 - rho * (1 - b));
  }

  function queueOf(station, avail) {
    var offered = station.minutes / avail;
    var c = station.processors;
    if (!c || !station.arrivals) return { wait: 0, length: 0, pWait: 0 };
    if (offered >= c) return { wait: Infinity, length: Infinity, pWait: 1 };
    var pWait = erlangC(c, offered);
    var rho = offered / c;
    // mean wait in minutes before service starts
    var wait = (pWait * station.serviceMinutes) / (c * (1 - rho));
    var rate = station.arrivals / avail; // items per minute
    return { wait: wait, length: rate * wait, pWait: pWait };
  }

  /* ---------------- a station and a centre ---------------- */

  function station(c, label, ops, productIds, period, share, z) {
    var st = workStats(c, ops, productIds, period, share);
    var avail = availableMinutes(c);
    var planned = st.mean + (z || 0) * st.sd;
    var n = ceilAt(planned / avail);
    var s = {
      label: label,
      ops: ops.slice(),
      minutes: st.mean,
      sd: st.sd,
      planned: planned,
      arrivals: st.arrivals,
      serviceMinutes: st.serviceMinutes,
      processors: n,
      load: st.mean / avail,
      utilization: n ? st.mean / (n * avail) : 0,
    };
    s.queue = queueOf(s, avail);
    return s;
  }

  function centre(c, id, stations) {
    var kept = stations.filter(function (s) {
      return s.processors > 0;
    });
    return {
      id: id,
      stations: kept,
      processors: kept.reduce(function (a, s) {
        return a + s.processors;
      }, 0),
      minutes: kept.reduce(function (a, s) {
        return a + s.minutes;
      }, 0),
    };
  }

  /* ---------------- where a product's work happens ----------------
   *
   * A stream is a quantity of one product walking its route, step by step,
   * through named centres. Streams give the network its arcs, and they are
   * what makes a fractal factory different from a function factory even when
   * both hold the same machines.
   */

  function one(id) {
    return [{ centre: id, frac: 1 }];
  }

  function streams(c, orgId, period) {
    if (orgId === "holographic") return holographic(c, period, 0).streams;
    var out = [];
    if (orgId === "product") {
      allProducts(c).forEach(function (p) {
        out.push({
          product: p,
          units: demandOf(c, p, period),
          steps: routeOf(c, p).map(function () {
            return one(p);
          }),
        });
      });
    } else if (orgId === "group") {
      c.groups.forEach(function (g) {
        g.products.forEach(function (p) {
          out.push({
            product: p,
            units: demandOf(c, p, period),
            steps: routeOf(c, p).map(function () {
              return one(g.id);
            }),
          });
        });
      });
    } else if (orgId === "fractal") {
      var f = Math.max(1, c.fractalCount | 0);
      for (var i = 0; i < f; i++) {
        var id = "f" + (i + 1);
        allProducts(c).forEach(function (p) {
          out.push({
            product: p,
            units: demandOf(c, p, period) / f,
            steps: routeOf(c, p).map(function () {
              return one(id);
            }),
          });
        });
      }
    } else if (orgId === "function") {
      allProducts(c).forEach(function (p) {
        out.push({
          product: p,
          units: demandOf(c, p, period),
          steps: routeOf(c, p).map(function (op) {
            return one("F-" + op);
          }),
        });
      });
    } else if (orgId === "process") {
      allProducts(c).forEach(function (p) {
        out.push({
          product: p,
          units: demandOf(c, p, period),
          steps: routeOf(c, p).map(function (op) {
            var pc = c.processCenters.filter(function (x) {
              return x.ops.indexOf(op) >= 0;
            })[0];
            return one(pc ? pc.id : "F-" + op);
          }),
        });
      });
    }
    return out;
  }

  /* Holographic counts an operation's machines exactly as the function
   * organization does, then stands each one up as its own centre carrying an
   * equal share of that operation's work — which is how a holographic factory
   * is run, with a job going to whichever instance is free.
   *
   * The machines are the same machines. What changes is that five processors
   * pooled in one centre become five separate single-processor centres, and a
   * single server at a given utilization makes a far longer queue than five
   * servers at that same utilization. That cost, and the extra travel between
   * scattered centres, is what the organization buys its flexibility with. */
  function holographic(c, period, z) {
    var avail = availableMinutes(c);
    var centres = [];
    var instancesOf = {};
    allOps(c).forEach(function (op) {
      var pooled = station(c, op, [op], allProducts(c), period, 1, z);
      var n = pooled.processors;
      instancesOf[op] = [];
      for (var i = 0; i < n; i++) {
        var id = op + "." + (i + 1);
        instancesOf[op].push(id);
        var s = {
          label: op,
          ops: [op],
          minutes: pooled.minutes / n,
          sd: pooled.sd / n,
          planned: pooled.planned / n,
          arrivals: pooled.arrivals / n,
          serviceMinutes: pooled.serviceMinutes,
          processors: 1,
          load: pooled.minutes / n / avail,
          utilization: pooled.minutes / n / avail,
        };
        s.queue = queueOf(s, avail);
        centres.push(centre(c, id, [s]));
      }
    });

    // a visit is as likely to land on any instance of its operation
    var sts = allProducts(c).map(function (p) {
      return {
        product: p,
        units: demandOf(c, p, period),
        steps: routeOf(c, p).map(function (op) {
          var list = instancesOf[op] || [];
          return list.map(function (id) {
            return { centre: id, frac: 1 / list.length };
          });
        }),
      };
    });
    return { centres: centres, streams: sts };
  }

  /* ---------------- the organizations ---------------- */

  var ORGANIZATIONS = [
    {
      id: "product",
      name: "Product organization",
      blurb:
        "One centre per product. Each centre owns every operation its product needs, so every centre rounds up on its own.",
      build: function (c, period, z) {
        return allProducts(c).map(function (pid) {
          var sts = routeOf(c, pid)
            .filter(function (op, i, a) {
              return a.indexOf(op) === i;
            })
            .map(function (op) {
              return station(c, op, [op], [pid], period, 1, z);
            });
          return centre(c, pid, sts);
        });
      },
    },
    {
      id: "group",
      name: "Group organization",
      blurb:
        "Products that travel alike are grouped, and each group gets a centre. Fewer ceilings than one centre per product.",
      build: function (c, period, z) {
        return c.groups.map(function (g) {
          var ops = [];
          g.products.forEach(function (pid) {
            routeOf(c, pid).forEach(function (op) {
              if (ops.indexOf(op) < 0) ops.push(op);
            });
          });
          return centre(
            c,
            g.id,
            ops.map(function (op) {
              return station(c, op, [op], g.products, period, 1, z);
            }),
          );
        });
      },
    },
    {
      id: "fractal",
      name: "Fractal organization",
      blurb:
        "f look-alike centres, each making every product at about 1/f of the demand. Growth means adding another whole centre.",
      build: function (c, period, z) {
        var f = Math.max(1, c.fractalCount | 0);
        var out = [];
        for (var i = 0; i < f; i++) {
          out.push(
            centre(
              c,
              "f" + (i + 1),
              allOps(c).map(function (op) {
                return station(c, op, [op], allProducts(c), period, 1 / f, z);
              }),
            ),
          );
        }
        return out;
      },
    },
    {
      id: "function",
      name: "Function organization",
      blurb:
        "One centre per elementary operation. Every product's demand for that operation is pooled, so this is the fewest dedicated machines.",
      build: function (c, period, z) {
        return allOps(c).map(function (op) {
          return centre(c, "F-" + op, [
            station(c, op, [op], allProducts(c), period, 1, z),
          ]);
        });
      },
    },
    {
      id: "process",
      name: "Process organization",
      blurb:
        "Composite centres holding several operations, served by processors flexible across them, so the ceilings pool too.",
      build: function (c, period, z) {
        return c.processCenters.map(function (pc) {
          return centre(c, pc.id, [
            station(c, pc.ops.join("+"), pc.ops, allProducts(c), period, 1, z),
          ]);
        });
      },
    },
    {
      id: "holographic",
      name: "Holographic organization",
      blurb:
        "The function pool broken into single-processor centres scattered through the factory, each loaded individually.",
      build: function (c, period, z) {
        return holographic(c, period, z).centres;
      },
    },
  ];

  function byId(id) {
    return ORGANIZATIONS.filter(function (o) {
      return o.id === id;
    })[0];
  }

  /* ---------------- flows between centres ---------------- */

  /* Units crossing from one centre to the next, summed over every product and
   * every step of its route, with IN standing for incoming materials and OUT
   * for finished parts. A step that may land on any of several machines splits
   * its units across them, so a scattered organization shows many thin arcs
   * where a concentrated one shows few thick ones. */
  function flows(c, orgId, period) {
    var sts = streams(c, orgId, period);
    var arcs = {};
    var inside = 0;
    function add(from, to, units, product) {
      if (units <= 0) return;
      if (from === to) {
        inside += units;
        return;
      }
      var k = from + "→" + to;
      if (!arcs[k]) arcs[k] = { from: from, to: to, units: 0, products: [] };
      arcs[k].units += units;
      if (arcs[k].products.indexOf(product) < 0) arcs[k].products.push(product);
    }
    sts.forEach(function (s) {
      if (!s.steps.length || !s.units) return;
      s.steps[0].forEach(function (a) {
        add("IN", a.centre, s.units * a.frac, s.product);
      });
      for (var i = 1; i < s.steps.length; i++) {
        s.steps[i - 1].forEach(function (a) {
          s.steps[i].forEach(function (b) {
            add(a.centre, b.centre, s.units * a.frac * b.frac, s.product);
          });
        });
      }
      s.steps[s.steps.length - 1].forEach(function (a) {
        add(a.centre, "OUT", s.units * a.frac, s.product);
      });
    });
    var list = Object.keys(arcs).map(function (k) {
      return arcs[k];
    });
    list.sort(function (a, b) {
      return b.units - a.units;
    });
    var between = list.filter(function (a) {
      return a.from !== "IN" && a.to !== "OUT";
    });
    return {
      arcs: list,
      betweenCentres: between,
      moves: between.reduce(function (a, x) {
        return a + x.units;
      }, 0),
      inside: inside,
    };
  }

  /* ---------------- one organization in one period ---------------- */

  function evaluate(c, orgId, period, z) {
    var org = byId(orgId);
    // A centre with no work is not standing: a product withdrawn from the
    // catalogue closes its centre, and the machines in it are freed.
    var centres = org.build(c, period, z || 0).filter(function (x) {
      return x.processors > 0;
    });
    var avail = availableMinutes(c);
    var processors = centres.reduce(function (a, x) {
      return a + x.processors;
    }, 0);
    var minutes = centres.reduce(function (a, x) {
      return a + x.minutes;
    }, 0);
    var worst = null,
      waited = 0,
      arrivals = 0;
    centres.forEach(function (ct) {
      ct.stations.forEach(function (s) {
        if (!worst || s.queue.wait > worst.wait)
          worst = { wait: s.queue.wait, centre: ct.id, station: s.label };
        if (s.arrivals && isFinite(s.queue.wait)) {
          waited += s.arrivals * s.queue.wait;
          arrivals += s.arrivals;
        }
      });
    });
    var f = flows(c, orgId, period);
    return {
      org: org,
      centres: centres,
      processors: processors,
      minutes: minutes,
      centreCount: centres.length,
      theoretical: minutes / avail,
      rounding: processors - minutes / avail,
      utilization: processors ? minutes / (processors * avail) : 0,
      flows: f,
      worstQueue: worst || { wait: 0, centre: "", station: "" },
      // minutes a part waits before being served, averaged over every visit it
      // makes: the price of breaking one pool of machines into several
      avgWait: arrivals ? waited / arrivals : 0,
      visits: arrivals,
      // parts standing in front of a machine at any moment, summed over the
      // factory: the waiting quantities, as against the waiting time
      waiting: centres.reduce(function (a, ct) {
        return (
          a +
          ct.stations.reduce(function (b, s) {
            return b + (isFinite(s.queue.length) ? s.queue.length : 0);
          }, 0)
        );
      }, 0),
    };
  }

  /* ---------------- the same organization across the years ----------------
   *
   * Between two years a centre may need more machines or fewer. A machine of
   * the same operation leaving one centre and appearing in another is moved,
   * not bought, which is the whole reason an organization that must be torn up
   * every year costs more than one that only grows.
   */

  function timeline(c, orgId, z) {
    var avail = availableMinutes(c);
    var years = c.periods.map(function (label, i) {
      var r = evaluate(c, orgId, i, z);
      var byCentreOp = {};
      var byOp = {};
      r.centres.forEach(function (ct) {
        ct.stations.forEach(function (s) {
          s.ops.forEach(function (op) {
            var k = ct.id + "|" + op;
            var share = s.processors / s.ops.length;
            byCentreOp[k] = (byCentreOp[k] || 0) + share;
            byOp[op] = (byOp[op] || 0) + share;
          });
        });
      });
      return { label: label, result: r, byCentreOp: byCentreOp, byOp: byOp };
    });

    var steps = [];
    for (var i = 1; i < years.length; i++) {
      var a = years[i - 1],
        b = years[i];
      var keys = Object.keys(a.byCentreOp)
        .concat(Object.keys(b.byCentreOp))
        .filter(function (k, j, arr) {
          return arr.indexOf(k) === j;
        });
      var added = 0,
        removed = 0;
      keys.forEach(function (k) {
        var d = (b.byCentreOp[k] || 0) - (a.byCentreOp[k] || 0);
        if (d > 0) added += d;
        else removed += -d;
      });
      // a removal and an addition of the same operation in the same step is a move
      var ops = Object.keys(a.byOp)
        .concat(Object.keys(b.byOp))
        .filter(function (k, j, arr) {
          return arr.indexOf(k) === j;
        });
      var moved = 0;
      ops.forEach(function (op) {
        var addOp = 0,
          remOp = 0;
        keys.forEach(function (k) {
          if (k.split("|")[1] !== op) return;
          var d = (b.byCentreOp[k] || 0) - (a.byCentreOp[k] || 0);
          if (d > 0) addOp += d;
          else remOp += -d;
        });
        moved += Math.min(addOp, remOp);
      });
      var bought = Math.max(0, added - moved);
      steps.push({
        from: a.label,
        to: b.label,
        added: added,
        removed: removed,
        moved: moved,
        bought: bought,
        retired: Math.max(0, removed - moved),
        cost: bought * c.money.install + moved * c.money.relocate,
      });
    }

    var first = years[0].result.processors;
    return {
      org: byId(orgId),
      years: years,
      steps: steps,
      initial: first,
      initialCost: first * c.money.install,
      changeCost: steps.reduce(function (a, s) {
        return a + s.cost;
      }, 0),
      totalCost:
        first * c.money.install +
        steps.reduce(function (a, s) {
          return a + s.cost;
        }, 0),
      bought: steps.reduce(function (a, s) {
        return a + s.bought;
      }, 0),
      moved: steps.reduce(function (a, s) {
        return a + s.moved;
      }, 0),
      peak: Math.max.apply(
        null,
        years.map(function (y) {
          return y.result.processors;
        }),
      ),
      avail: avail,
    };
  }

  /* ---------------- two levels of layout ----------------
   *
   * The lower level packs an operation's processors inside their centre; the
   * upper level packs the centres into the building. Both are shelf packing,
   * which is crude but deterministic and good enough to turn a count of moves
   * into a distance travelled, and a count of machines into floor area.
   *
   * Travel is rectilinear between centre centroids, as a vehicle on aisles
   * moves, and is what layout adds that a flow count alone cannot show.
   */

  function opBox(c, op) {
    var o = c.operations.filter(function (x) {
      return x.id === op;
    })[0];
    var g = 1 + c.space.insideCentre;
    return o
      ? { w: o.w * Math.sqrt(g), h: o.h * Math.sqrt(g) }
      : { w: 3, h: 3 };
  }

  /* lay rectangles out in shelves inside a box of the given width, returning
   * the placements and the height used */
  function shelve(items, width) {
    var x = 0,
      y = 0,
      rowH = 0,
      out = [];
    items.forEach(function (it) {
      if (x > 0 && x + it.w > width) {
        y += rowH;
        x = 0;
        rowH = 0;
      }
      out.push({ ref: it.ref, x: x, y: y, w: it.w, h: it.h });
      x += it.w;
      if (it.h > rowH) rowH = it.h;
    });
    return { placed: out, height: y + rowH };
  }

  /* the inside of one centre */
  function centreLayout(c, ct) {
    var boxes = [];
    ct.stations.forEach(function (s) {
      // A station is one pool of interchangeable processors. A flexible one
      // has to fit the largest operation it may be asked to perform, so its
      // footprint is the envelope of them all, and there are as many machines
      // as the station has processors however many operations they cover.
      var w = 0,
        h = 0;
      s.ops.forEach(function (op) {
        var b = opBox(c, op);
        if (b.w > w) w = b.w;
        if (b.h > h) h = b.h;
      });
      for (var i = 0; i < s.processors; i++)
        boxes.push({ ref: s.ops[i % s.ops.length], w: w, h: h });
    });
    if (!boxes.length) return { w: 0, h: 0, machines: [] };
    boxes.sort(function (a, b) {
      return b.h - a.h || b.w - a.w;
    });
    var area = boxes.reduce(function (a, b) {
      return a + b.w * b.h;
    }, 0);
    // try a few widths and keep the tidiest square-ish result
    var best = null;
    var widest = Math.max.apply(
      null,
      boxes.map(function (b) {
        return b.w;
      }),
    );
    for (var k = 1; k <= boxes.length; k++) {
      var width = Math.max(widest, Math.sqrt(area) * (0.6 + 0.12 * k));
      var r = shelve(boxes, width);
      var waste = width * r.height - area;
      var ratio = Math.max(width, r.height) / Math.min(width, r.height);
      var score = waste + area * (ratio - 1) * 0.25;
      if (!best || score < best.score)
        best = { score: score, w: width, h: r.height, machines: r.placed };
    }
    return { w: best.w, h: best.h, machines: best.machines };
  }

  /* the building, and the travel it implies */
  function layout(c, orgId, period, z) {
    var r = evaluate(c, orgId, period, z);
    var pad = c.space.betweenCentres;
    var inner = r.centres.map(function (ct) {
      var L = centreLayout(c, ct);
      var g = Math.sqrt(1 + pad);
      return {
        id: ct.id,
        processors: ct.processors,
        inner: L,
        w: L.w * g,
        h: L.h * g,
      };
    });
    var area = inner.reduce(function (a, x) {
      return a + x.w * x.h;
    }, 0);
    var items = inner
      .slice()
      .sort(function (a, b) {
        return b.h - a.h || b.w - a.w;
      })
      .map(function (x) {
        return { ref: x, w: x.w + c.space.aisle, h: x.h + c.space.aisle };
      });
    var widest = Math.max.apply(
      null,
      items.map(function (i) {
        return i.w;
      }),
    );
    var best = null;
    for (var k = 1; k <= items.length; k++) {
      var width = Math.max(widest, Math.sqrt(area) * (0.7 + 0.15 * k));
      var sh = shelve(items, width);
      var ratio = Math.max(width, sh.height) / Math.min(width, sh.height);
      var score = width * sh.height + area * (ratio - 1) * 0.3;
      if (!best || score < best.score)
        best = { score: score, w: width, h: sh.height, placed: sh.placed };
    }

    var at = {};
    best.placed.forEach(function (p) {
      at[p.ref.id] = {
        id: p.ref.id,
        x: p.x,
        y: p.y,
        w: p.w - c.space.aisle,
        h: p.h - c.space.aisle,
        cx: p.x + (p.w - c.space.aisle) / 2,
        cy: p.y + (p.h - c.space.aisle) / 2,
        processors: p.ref.processors,
        inner: p.ref.inner,
      };
    });
    // docks sit on the left and the right wall
    at.IN = {
      id: "IN",
      x: 0,
      y: best.h / 2,
      w: 0,
      h: 0,
      cx: 0,
      cy: best.h / 2,
    };
    at.OUT = {
      id: "OUT",
      x: best.w,
      y: best.h / 2,
      w: 0,
      h: 0,
      cx: best.w,
      cy: best.h / 2,
    };

    var travel = 0,
      betweenTravel = 0;
    r.flows.arcs.forEach(function (a) {
      var p = at[a.from],
        q = at[a.to];
      if (!p || !q) return;
      var d = Math.abs(p.cx - q.cx) + Math.abs(p.cy - q.cy);
      travel += a.units * d;
      if (a.from !== "IN" && a.to !== "OUT") betweenTravel += a.units * d;
    });

    return {
      result: r,
      building: { w: best.w, h: best.h, area: best.w * best.h },
      centres: at,
      order: best.placed.map(function (p) {
        return p.ref.id;
      }),
      usedArea: area,
      travel: travel,
      betweenTravel: betweenTravel,
      perMove: r.flows.arcs.reduce(function (a, x) {
        return a + x.units;
      }, 0)
        ? travel /
          r.flows.arcs.reduce(function (a, x) {
            return a + x.units;
          }, 0)
        : 0,
      floorCost: best.w * best.h * c.money.floor,
    };
  }

  /* ---------------- the standing reconciliation ---------------- */

  function calibration(c) {
    // always read on Year 1 at the mean, which is what slide 19 shows
    var r = evaluate(c, "function", 0, 0);
    var rows = allOps(c).map(function (op) {
      var ct = r.centres.filter(function (x) {
        return x.id === "F-" + op;
      })[0];
      var got = ct ? ct.processors : 0;
      return {
        op: op,
        drawn: c.drawn[op],
        computed: got,
        utilization: ct && ct.stations[0] ? ct.stations[0].utilization : 0,
        ok: got === c.drawn[op],
      };
    });
    return {
      rows: rows,
      ok: rows.every(function (x) {
        return x.ok;
      }),
      drawnTotal: rows.reduce(function (a, x) {
        return a + x.drawn;
      }, 0),
      computedTotal: rows.reduce(function (a, x) {
        return a + x.computed;
      }, 0),
    };
  }

  return {
    ORGANIZATIONS: ORGANIZATIONS,
    availableMinutes: availableMinutes,
    workStats: workStats,
    erlangC: erlangC,
    evaluate: evaluate,
    layout: layout,
    centreLayout: centreLayout,
    timeline: timeline,
    flows: flows,
    streams: streams,

  function diagram(r) {

      H = 460,

        svg("rect", {
          x: num(c.x, 1),
          y: num(c.y, 1),
          width: num(c.w, 1),
          height: num(c.h, 1),
          fill: "#ffffff",
          stroke: "#1f5fa8",
          "stroke-width": 0.7,
          rx: 0.6,
        }),
      );
      (c.inner.machines || []).forEach(function (mch) {
        var o = opInfo(mch.ref);
        g.appendChild(
          svg("rect", {
            x: num(c.x + mch.x * (c.w / Math.max(1, c.inner.w)), 2),
            y: num(c.y + mch.y * (c.h / Math.max(1, c.inner.h)), 2),
            width: num(mch.w * (c.w / Math.max(1, c.inner.w)) * 0.86, 2),
            height: num(mch.h * (c.h / Math.max(1, c.inner.h)) * 0.86, 2),
            fill: o ? o.fill : "#9aa7b4",
            "fill-opacity": 0.8,
            stroke: "rgba(0,0,0,.3)",
            "stroke-width": 0.25,
            rx: 0.3,
          }),
        );
      });
      var t = svg("text", {
        x: num(c.x + c.w / 2, 1),
        y: num(c.y - 1.2, 1),
        "text-anchor": "middle",
        "font-size": 2.6,
        fill: "#5d6a79",
      });
      t.textContent = id.replace("F-", "") + " \u00b7 " + c.processors;
      g.appendChild(t);
      box.appendChild(document.createTextNode(""));
      s.appendChild(g);
    });

    [
      ["IN", 0, H / 2],
      ["OUT", W, H / 2],
    ].forEach(function (d) {
      s.appendChild(
        svg("circle", {
          cx: num(d[1], 1),
          cy: num(d[2], 1),
          r: 2.2,
          fill: "#eef1f5",
          stroke: "#9aa7b4",
          "stroke-width": 0.6,
        }),
      );
      var t = svg("text", {
        x: num(d[1], 1),
        y: num(d[2] + 5.5, 1),
        "text-anchor": "middle",
        "font-size": 2.6,
        fill: "#5d6a79",
      });
      t.textContent = d[0];
      s.appendChild(t);
    });

    box.appendChild(s);
    box.appendChild(
      el("p", {
        class: "note",
        text:
          "Each outlined block is a centre, labelled with its machine count; the coloured rectangles " +
          "inside it are the processors, drawn in the colour of their operation. IN and OUT are the " +
          "docks on the two walls.",
      }),
    );
    return box;
  }

  /* ---------------- tab: compare ---------------- */

  function compareTab() {
    var wrap = el("div", {});
    wrap.appendChild(calibrationBanner());
    wrap.appendChild(controls({}));

    var rows = Engine.ORGANIZATIONS.map(function (o) {
      return Engine.evaluate(CASE, o.id, state.period, z());
    });
    var lay = {};
    Engine.ORGANIZATIONS.forEach(function (o) {
      lay[o.id] = Engine.layout(CASE, o.id, state.period, z());
    });
    var most = Math.max.apply(
      null,
      rows.map(function (r) {
        return r.processors;
      }),
    );

    var t = el("table", { class: "big" });
    t.appendChild(
      el("tr", {}, [
        el("th", { class: "l", text: "Organization" }),
        el("th", { class: "r", text: "Centres" }),
        el("th", { class: "r", text: "Machines" }),
        el("th", { class: "r", text: "For rounding" }),
        el("th", { class: "r", text: "Utilization" }),
        el("th", { class: "r", text: "Wait per visit" }),
        el("th", { class: "r", text: "Parts waiting" }),
        el("th", { class: "r", text: "Moves between centres" }),
        el("th", { class: "r", text: "Travel" }),
        el("th", { class: "r", text: "Floor" }),
        el("th", { class: "l", text: "" }),
      ]),
    );
    rows.forEach(function (r) {
      var cell = el("td", { class: "l wide" }, [
        el("span", { class: "bar bar-wide" }, [
          el("span", {
            class: "bar-fill bar-count",
            style: "width:" + pct(r.processors / most),
          }),
        ]),
      ]);
      t.appendChild(
        el("tr", { class: r.org.id === state.org ? "row-on" : "" }, [
          el("td", { class: "l", text: r.org.name }),
          el("td", { class: "r", text: String(r.centreCount) }),
          el("td", { class: "r strong", text: String(r.processors) }),
          el("td", { class: "r", text: "+" + num(r.rounding, 2) }),
          el("td", { class: "r", text: pct(r.utilization) }),
          el("td", { class: "r", text: mins(r.avgWait) }),
          el("td", { class: "r", text: num(r.waiting, 1) }),
          el("td", { class: "r", text: qty(r.flows.moves) }),
          el("td", { class: "r", text: qty(lay[r.org.id].travel) + " m" }),
          el("td", {
            class: "r",
            text: qty(lay[r.org.id].building.area) + " m\u00b2",
          }),
          cell,
        ]),
      );
    });
    wrap.appendChild(t);

    var f = rows.filter(function (r) {
      return r.org.id === "function";
    })[0];
    var p = rows.filter(function (r) {
      return r.org.id === "product";
    })[0];
    var h = rows.filter(function (r) {
      return r.org.id === "holographic";
    })[0];

    wrap.appendChild(
      el("div", { class: "insight" }, [
        el("h3", { text: "Reading the table" }),
        el("p", {
          text:
            "The work to be done never changes: " +
            num(f.theoretical, 2) +
            " processors' worth, whichever way the factory is cut. What changes is how many times that " +
            "work is divided before each piece is rounded up to a whole machine.",
        }),
        el("p", {
          text:
            "The function organization pools every product's demand for an operation and rounds up once " +
            "per operation: " +
            f.processors +
            " machines. The product organization rounds up inside each of its centres: " +
            p.processors +
            " machines for the same output, and " +
            qty(p.flows.moves) +
            " moves between centres against " +
            qty(f.flows.moves) +
            " — it buys machines to avoid travel.",
        }),
        el("p", {
          text:
            "The holographic organization holds the same " +
            h.processors +
            " machines as the function organization, at the same utilization, yet a part waits " +
            mins(h.avgWait) +
            " against " +
            mins(f.avgWait) +
            ". Breaking one pool of machines into separate single-machine centres costs nothing in " +
            "capital and a great deal in queueing, and that is what it pays for the freedom to place " +
            "them anywhere.",
        }),
        el("p", {
          text:
            "Laid out, the account closes. The product organization carries parts " +
            qty(lay.product.travel) +
            " metres a period and the function organization " +
            qty(lay["function"].travel) +
            " — the machines a product organization buys are what it spends to avoid that travel, and " +
            "the floor it needs for them, " +
            qty(lay.product.building.area) +
            " m\u00b2 against " +
            qty(lay["function"].building.area) +
            " m\u00b2, is part of the bill.",
        }),
      ]),
    );
    return wrap;
  }

  /* ---------------- tab: case ---------------- */

  function caseTab() {
    var wrap = el("div", {});
    wrap.appendChild(
      el("div", { class: "insight" }, [
        el("h3", { text: "Where this case comes from" }),
        el("p", {
          text:
            "The seven products and their routings are read off slide 3 of Supply Chain Facility " +
            "Organization Design Fundamentals, version 2025/10/14, after Montreuil & Lefrancois (1996). " +
            "The equipment counts the tool is calibrated against are read off slide 19.",
        }),
        el("p", {
          text:
            "Demand and operation times are not on the slides. They are synthetic, fitted until the " +
            "function organization in Year 1 computes exactly the processors drawn on slide 19. A period " +
            "is one " +
            CASE.period.hours +
            "-hour workday at " +
            pct(CASE.period.efficiency) +
            " processor efficiency, the convention of slide 64, so one processor offers " +
            Engine.availableMinutes(CASE) +
            " minutes per period.",
        }),
      ]),
    );

    var t = el("table", { class: "big" });
    var head = [el("th", { class: "l", text: "Product" })];
    CASE.periods.forEach(function (p) {
      head.push(el("th", { class: "r", text: p }));
    });
    head.push(el("th", { class: "r", text: "Demand CoV" }));
    head.push(el("th", { class: "l", text: "Route, with minutes per unit" }));
    t.appendChild(el("tr", {}, head));

    CASE.products.forEach(function (p) {
      var cells = [el("td", { class: "l strong", text: p.id })];
      CASE.periods.forEach(function (_, i) {
        var inp = el("input", {
          class: "dem",
          type: "number",
          min: "0",
          step: "10",
          value: String(p.demand[i]),
        });
        inp.addEventListener("change", function () {
          var v = Number(inp.value);
          if (isFinite(v) && v >= 0) {
            p.demand[i] = v;
            render();
          }
        });
        cells.push(el("td", { class: "r" }, [inp]));
      });
      var cv = el("input", {
        class: "dem narrow",
        type: "number",
        min: "0",
        max: "1",
        step: "0.01",
        value: String(p.cv),
      });
      cv.addEventListener("change", function () {
        var v = Number(cv.value);
        if (isFinite(v) && v >= 0 && v <= 1) {
          p.cv = v;
          render();
        }
      });
      cells.push(el("td", { class: "r" }, [cv]));

      var route = el("span", { class: "route" });
      p.route.forEach(function (op, i) {
        if (i) route.appendChild(el("span", { class: "arrow", text: "→" }));
        var t = el("input", {
          class: "step-in",
          type: "number",
          min: "0.05",
          max: "60",
          step: "0.01",
          value: String(Engine.timeOf(CASE, op, p.id)),
          title: op + " on " + p.id + ", minutes per unit",
        });
        t.addEventListener("change", function () {
          var v = Number(t.value);
          if (isFinite(v) && v > 0) {
            CASE.times[op][p.id] = v;
            render();
          }
        });
        route.appendChild(el("span", { class: "step" }, [glyph(op, 16), t]));
      });
      cells.push(el("td", { class: "l" }, [route]));
      t.appendChild(el("tr", {}, cells));
    });
    wrap.appendChild(t);

    wrap.appendChild(
      el("p", {
        class: "note",
        text:
          "Change a demand or a coefficient of variation and every tab recomputes. The banner turns " +
          "amber as soon as Year 1 stops reproducing slide 19, which is the signal that the case has " +
          "drifted away from the one taught in class.",
      }),
    );

    var sl = Engine.evaluate(CASE, "function", state.period, z());
    var mean = Engine.evaluate(CASE, "function", state.period, 0);
    wrap.appendChild(el("h3", { class: "h3", text: "What robustness costs" }));
    var rt = el("table", { class: "big" });
    rt.appendChild(
      el("tr", {}, [
        el("th", { class: "l", text: "Capacity sized for" }),
        el("th", { class: "r", text: "Processors needed" }),
        el("th", { class: "r", text: "Machines" }),
        el("th", { class: "r", text: "Utilization" }),
      ]),
    );
    CASE.serviceLevels.forEach(function (lvl, i) {
      var r = Engine.evaluate(CASE, "function", state.period, lvl.z);
      var planned = r.centres.reduce(function (a, c) {
        return (
          a +
          c.stations.reduce(function (b, s) {
            return b + s.planned;
          }, 0)
        );
      }, 0);
      rt.appendChild(
        el("tr", { class: state.sl === i ? "row-on" : "" }, [
          el("td", {
            class: "l",
            text: lvl.label === "mean" ? "the mean" : lvl.label + " of periods",
          }),
          el("td", {
            class: "r",
            text: num(planned / Engine.availableMinutes(CASE), 2),
          }),
          el("td", { class: "r strong", text: String(r.processors) }),
          el("td", { class: "r", text: pct(r.utilization) }),
        ]),
      );
    });
    wrap.appendChild(rt);
    wrap.appendChild(
      el("p", {
        class: "note",
        text:
          "Demand for each product is treated as one random quantity with the coefficient of variation " +
          "above, products independent of one another. Pooling seven products leaves the function " +
          "organization with a spread of only a few per cent, which is why 95% and 99% often land on the " +
          "same whole machines — a result worth showing rather than hiding.",
      }),
    );

    wrap.appendChild(
      el("h3", { class: "h3", text: "How the centres are formed" }),
    );
    var forms = el("div", { class: "forms" });

    var gbox = el("div", { class: "form" });
    gbox.appendChild(el("div", { class: "form-k", text: "Group centres" }));
    CASE.groups.forEach(function (g, i) {
      var inp = el("input", {
        class: "text",
        value: g.products.join(" "),
        title: "products assigned to " + g.id,
      });
      inp.addEventListener("change", function () {
        var want = inp.value
          .toUpperCase()
          .split(/[^A-Z0-9]+/)
          .filter(Boolean);
        var known = Engine.allProducts(CASE);
        CASE.groups[i].products = want.filter(function (p) {
          return known.indexOf(p) >= 0;
        });
        render();
      });
      gbox.appendChild(
        el("div", { class: "form-row" }, [
          el("span", { class: "form-id", text: g.id }),
          inp,
        ]),
      );
    });
    var missing = Engine.allProducts(CASE).filter(function (p) {
      return !CASE.groups.some(function (g) {
        return g.products.indexOf(p) >= 0;
      });
    });
    gbox.appendChild(
      el("div", {
        class: missing.length ? "form-warn" : "form-ok",
        text: missing.length
          ? "not in any group: " + missing.join(" ")
          : "every product is in exactly one group",
      }),
    );
    forms.appendChild(gbox);

    var pbox = el("div", { class: "form" });
    pbox.appendChild(el("div", { class: "form-k", text: "Composite centres" }));
    CASE.processCenters.forEach(function (pc, i) {
      var inp = el("input", {
        class: "text",
        value: pc.ops.join(" "),
        title: "operations carried by " + pc.id,
      });
      inp.addEventListener("change", function () {
        var want = inp.value
          .toUpperCase()
          .split(/[^A-Z0-9]+/)
          .filter(Boolean);
        var known = Engine.allOps(CASE);
        CASE.processCenters[i].ops = want.filter(function (o) {
          return known.indexOf(o) >= 0;
        });
        render();
      });
      pbox.appendChild(
        el("div", { class: "form-row" }, [
          el("span", { class: "form-id", text: pc.id }),
          inp,
        ]),
      );
    });
    var uncovered = Engine.allOps(CASE).filter(function (o) {
      return !CASE.processCenters.some(function (pc) {
        return pc.ops.indexOf(o) >= 0;
      });
    });
    pbox.appendChild(
      el("div", {
        class: uncovered.length ? "form-warn" : "form-ok",
        text: uncovered.length
          ? "not in any centre: " + uncovered.join(" ")
          : "every operation is in a centre",
      }),
    );
    forms.appendChild(pbox);
    wrap.appendChild(forms);
    wrap.appendChild(
      el("p", {
        class: "note",
        text:
          "An operation left out of every composite centre falls back to a centre of its own, so the " +
          "process organization always makes all the parts. A product left out of every group is not " +
          "made at all by the group organization, which the line above warns about.",
      }),
    );

    wrap.appendChild(el("h3", { class: "h3", text: "Carry a case away" }));
    var files = el("div", { class: "picker" });
    files.appendChild(
      el("button", {
        class: "pick",
        text: "Save this case",
        onclick: saveCase,
      }),
    );
    var file = el("input", {
      type: "file",
      accept: ".json",
      class: "hidden-file",
    });
    file.addEventListener("change", function () {
      var f = file.files && file.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        loadCase(String(fr.result));
      };
      fr.readAsText(f);
    });
    files.appendChild(
      el("button", {
        class: "pick",
        text: "Load a case",
        onclick: function () {
          file.click();
        },
      }),
    );
    files.appendChild(
      el("button", {
        class: "pick",
        text: "Back to the lecture case",
        onclick: function () {
          loadCase(JSON.stringify(ORIGINAL));
        },
      }),
    );
    files.appendChild(file);
    wrap.appendChild(files);
    wrap.appendChild(
      el("p", {
        class: "note",
        text:
          "Saving writes the whole case — products, routes, demand per year, variability, times, " +
          "footprints, groups and prices — to a file. Loading one back replaces the case in the page, " +
          "so a variant can be built, kept and handed on.",
      }),
    );

    var legend = el("div", { class: "legend" });
    CASE.operations.forEach(function (o) {
      legend.appendChild(
        el("span", { class: "leg" }, [
          glyph(o.id, 16),
          el("span", { text: o.id + " · " + o.name }),
        ]),
      );
    });
    wrap.appendChild(el("h3", { class: "h3", text: "Operations" }));
    wrap.appendChild(legend);
    return wrap;
  }

  /* ---------------- tab: scope ---------------- */

  function nextTab() {
    var wrap = el("div", {});
    function block(title, items, tone) {
      var b = el("div", { class: "insight " + (tone || "") });
      b.appendChild(el("h3", { text: title }));
      var ul = el("ul", {});
      items.forEach(function (i) {
        ul.appendChild(el("li", { text: i }));
      });
      b.appendChild(ul);
      return b;
    }
    wrap.appendChild(
      block("In this version", [
        "The seven-product case of the organization design lecture, with its routings, demand for each of four years, demand variability, process times and machine footprints, all editable on the page.",
        "Required processors and utilization per centre, computed from demand and times alone.",
        "Capacity sized on the mean or for a stated robustness, and what that robustness costs in machines.",
        "The wait in front of every station and the parts standing in it, from Erlang C on its offered load.",
        "Six organizations: product, group, fractal, function, process and holographic, with the groups, the composite centres and the number of fractal centres formed on the page.",
        "The organizational network, with the parts crossing between centres and the parts that never leave one.",
        "Two levels of layout — the processors inside a centre, the centres inside the building — and the travel and floor area they imply.",
        "Four years of demand in which one product is withdrawn, the machines bought, moved and retired between them, and what the change costs.",
        "A case that can be saved to a file, loaded back, and reset to the lecture case.",
        "A standing check that Year 1 on the mean still reproduces the processor counts drawn on slide 19.",
      ]),
    );
    wrap.appendChild(
      block(
        "Not here yet",
        [
          "Work in process held between machines and between centres.",
          "Operators and operating cost, as against floor and capital.",
          "Setup times, which the lecture sets aside for now.",
          "Designs proposed by the tool rather than described to it.",
        ],
        "insight-soft",
      ),
    );
    wrap.appendChild(
      block(
        "What the numbers rest on",
        [
          "The seven products, their routings and the processor counts the tool is calibrated against are read off slides 3 and 19 of the organization design lecture, after Montreuil & Lefrancois (1996).",
          "A period is one 20-hour workday at 80% processor efficiency, the convention of slide 64.",
          "Demand and process times are synthetic. They were fitted by reverse calibration until the function organization in Year 1 computes exactly the counts drawn on slide 19, and the page re-checks that on every edit.",
          "Machine footprints, the relocation price and the purchase price rest on judgement alone. Nothing on the slides fixes them, and the figures used here are meant to be replaced.",
        ],
        "insight-ask",
      ),
    );
    return wrap;
  }

  /* ---------------- carrying a case away ----------------
   *
   * The whole case travels as one JSON file, so a variant can be built in the
   * page, kept, and handed to someone else. The lecture case is held aside at
   * load so there is always a way back to the one the slides reconcile with.
   */

  var FIELDS = [
    "period",
    "operations",
    "periods",
    "products",
    "times",
    "drawn",
    "groups",
    "processCenters",
    "fractalCount",
    "money",
    "space",
    "serviceLevels",
  ];

  function snapshot() {
    return FIELDS.reduce(function (a, k) {
      a[k] = CASE[k];
      return a;
    }, {});
  }

  var ORIGINAL = JSON.parse(JSON.stringify(snapshot()));

  function saveCase() {
    var blob = new Blob([JSON.stringify(snapshot(), null, 1)], {
      type: "application/json",
    });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "factory-organization-case.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 0);
  }

  function loadCase(txt) {
    var data;
    try {
      data = JSON.parse(txt);
    } catch (e) {
      window.alert("That file is not a saved case.");
      return false;
    }
    var need = ["products", "operations", "times", "periods"];
    var missing = need.filter(function (k) {
      return !data[k];
    });
    if (missing.length) {
      window.alert("That file has no " + missing.join(", ") + ".");
      return false;
    }
    FIELDS.forEach(function (k) {
      if (data[k] !== undefined) CASE[k] = JSON.parse(JSON.stringify(data[k]));
    });
    state.period = 0;
    state.sl = 0;
    render();
    return true;
  }

  /* ---------------- shell ---------------- */

  var TABS = [
    ["capacity", "Capacity", capacityTab],
    ["network", "Network", networkTab],
    ["layout", "Layout", layoutTab],
    ["years", "Over the years", yearsTab],
    ["compare", "Compare", compareTab],
    ["case", "The case", caseTab],
    ["next", "Scope and questions", nextTab],
  ];

  function render() {
    var nav = $("#tabs");
    nav.innerHTML = "";
    TABS.forEach(function (t) {
      nav.appendChild(
        el("button", {
          class: "tab " + (state.tab === t[0] ? "tab-on" : ""),
          text: t[1],
          onclick: function () {
            state.tab = t[0];
            render();
          },
        }),
      );
    });
    var body = $("#body");
    body.innerHTML = "";
    TABS.forEach(function (t) {
      if (t[0] === state.tab) body.appendChild(t[2]());
    });
  }

  window.addEventListener("DOMContentLoaded", render);
})();

</script>
